<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GigaPuddings</title>
  <desc id="desc">Local-first desktop tools built with TypeScript, Rust, and Tauri.</desc>

  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117" />
      <stop offset="0.55" stop-color="#111827" />
      <stop offset="1" stop-color="#172033" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 56) rotate(135) scale(285 220)">
      <stop stop-color="#58A6FF" stop-opacity="0.28" />
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 330) rotate(-72) scale(260 330)">
      <stop stop-color="#A371F7" stop-opacity="0.18" />
      <stop offset="1" stop-color="#A371F7" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#8B949E" stroke-opacity="0.08" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)" />
    <rect width="1200" height="300" fill="url(#grid)" />
    <rect width="1200" height="300" fill="url(#blueGlow)" />
    <rect width="1200" height="300" fill="url(#violetGlow)" />

    <circle cx="72" cy="56" r="5" fill="#58A6FF" />
    <text x="92" y="63" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">HELLO, I'M</text>
    <text x="70" y="143" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="750">GigaPuddings</text>
    <text x="72" y="196" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="450">Local-first desktop tools for real-world workflows.</text>
    <text x="72" y="242" fill="#58A6FF" font-family="Cascadia Code, Consolas, monospace" font-size="18">TypeScript  ×  Rust  ×  Tauri</text>

    <g transform="translate(842 56)">
      <rect width="286" height="188" rx="18" fill="#0D1117" fill-opacity="0.82" stroke="#30363D" stroke-width="2" />
      <path d="M0 46H286" stroke="#30363D" stroke-width="2" />
      <circle cx="24" cy="23" r="5" fill="#FF7B72" />
      <circle cx="44" cy="23" r="5" fill="#F2CC60" />
      <circle cx="64" cy="23" r="5" fill="#3FB950" />

      <path d="M47 84L28 101L47 118" stroke="#A371F7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M87 75L69 127" stroke="#8B949E" stroke-width="7" stroke-linecap="round" />
      <path d="M109 84L128 101L109 118" stroke="#58A6FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="158" y="76" width="91" height="8" rx="4" fill="#58A6FF" fill-opacity="0.9" />
      <rect x="158" y="98" width="68" height="8" rx="4" fill="#A371F7" fill-opacity="0.8" />
      <rect x="158" y="120" width="82" height="8" rx="4" fill="#3FB950" fill-opacity="0.8" />
      <rect x="28" y="152" width="221" height="7" rx="3.5" fill="#8B949E" fill-opacity="0.22" />
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="27" stroke="#30363D" stroke-width="2" />
</svg>
