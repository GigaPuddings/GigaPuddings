<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GigaPuddings</title>
  <desc id="desc">Local-first desktop tools built with TypeScript, Rust, and Tauri.</desc>

  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#F6F8FA" />
      <stop offset="1" stop-color="#EEF5FF" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 48) rotate(135) scale(300 230)">
      <stop stop-color="#54AEFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#54AEFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(750 330) rotate(-72) scale(270 350)">
      <stop stop-color="#8250DF" stop-opacity="0.12" />
      <stop offset="1" stop-color="#8250DF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#57606A" stroke-opacity="0.07" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)" />
    <rect width="1200" height="300" fill="url(#grid)" />
    <rect width="1200" height="300" fill="url(#blueGlow)" />
    <rect width="1200" height="300" fill="url(#violetGlow)" />

    <circle cx="72" cy="56" r="5" fill="#0969DA" />
    <text x="92" y="63" fill="#57606A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">HELLO, I'M</text>
    <text x="70" y="143" fill="#1F2328" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="750">GigaPuddings</text>
    <text x="72" y="196" fill="#57606A" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="450">Local-first desktop tools for real-world workflows.</text>
    <text x="72" y="242" fill="#0969DA" font-family="Cascadia Code, Consolas, monospace" font-size="18">TypeScript  ×  Rust  ×  Tauri</text>

    <g transform="translate(842 56)">
      <rect width="286" height="188" rx="18" fill="#FFFFFF" fill-opacity="0.9" stroke="#D0D7DE" stroke-width="2" />
      <path d="M0 46H286" stroke="#D0D7DE" stroke-width="2" />
      <circle cx="24" cy="23" r="5" fill="#CF222E" />
      <circle cx="44" cy="23" r="5" fill="#BF8700" />
      <circle cx="64" cy="23" r="5" fill="#1A7F37" />

      <path d="M47 84L28 101L47 118" stroke="#8250DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M87 75L69 127" stroke="#57606A" stroke-width="7" stroke-linecap="round" />
      <path d="M109 84L128 101L109 118" stroke="#0969DA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="158" y="76" width="91" height="8" rx="4" fill="#0969DA" fill-opacity="0.88" />
      <rect x="158" y="98" width="68" height="8" rx="4" fill="#8250DF" fill-opacity="0.78" />
      <rect x="158" y="120" width="82" height="8" rx="4" fill="#1A7F37" fill-opacity="0.78" />
      <rect x="28" y="152" width="221" height="7" rx="3.5" fill="#57606A" fill-opacity="0.18" />
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="27" stroke="#D0D7DE" stroke-width="2" />
</svg>
